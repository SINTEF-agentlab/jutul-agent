name: Simulators

# Per-simulator smoke tests against a live Julia env. Separate from the main CI
# lane because instantiating simulator libraries is a multi-minute precompile.
# Since the envs ship no committed Manifest and carry no version pins, every run
# resolves the latest compatible upstream, so a green run here means jutul-agent
# still works against current version of simulators.
on:
  # On PRs and pushes to main: did my change break a simulator?
  pull_request:
  push:
    branches: [main]
  # Weekly: did an upstream release break us since the last commit?
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  workflow_dispatch:

jobs:
  smoke:
    name: ${{ matrix.simulator }}
    strategy:
      # One simulator failing shouldn't cancel the others, we want to see
      # exactly which upstreams broke.
      fail-fast: false
      matrix:
        simulator: [jutuldarcy, battmo, fimbul, mocca]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      # Matrix-aware by default: each simulator gets its own depot cache, so a
      # change to one env doesn't invalidate the others.
      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      # The envs include GLMakie, which needs an OpenGL context even to
      # precompile; the runner is headless, so provide a virtual X server plus
      # Mesa software GL (same recipe as the plot-integration lane).
      - name: Install headless OpenGL (xvfb + Mesa)
        run: sudo apt-get update && sudo apt-get install -y xvfb xorg-dev mesa-utils libgl1 libgl1-mesa-dri

      # Sync the shared JutulAgent package into the template (it lives once in
      # julia_runtime/ and is copied in at bootstrap; an in-place instantiate must
      # do the same so the env's relative [sources] resolves). Then refresh the
      # registry so a fresh resolve sees the latest releases and instantiate from
      # Project + [sources]. Precompilation is split out as an explicit
      # Pkg.precompile(), which throws when a direct dependency fails — a bare
      # Pkg.instantiate() only auto-precompiles best-effort and exits 0 even if
      # GLMakie and the warm packages all failed, turning the lane green on a
      # broken env.
      - name: Instantiate ${{ matrix.simulator }} env
        run: >
          uv run python -c "from pathlib import Path; from jutul_agent.workspace import
          sync_shared_julia_package as s;
          s(Path('src/jutul_agent/simulators/${{ matrix.simulator }}/julia_env'))" &&
          xvfb-run -a julia
          --project=src/jutul_agent/simulators/${{ matrix.simulator }}/julia_env
          --startup-file=no
          -e 'using Pkg; Pkg.Registry.update();
          withenv("JULIA_PKG_PRECOMPILE_AUTO" => "0") do; Pkg.instantiate(); end;
          Pkg.precompile()'

      - name: Smoke test (env loads + using ${{ matrix.simulator }})
        run: uv run pytest tests/test_simulators_smoke.py -k ${{ matrix.simulator }} -ra

  # One real system image, end to end. Weekly and on demand only: the build is
  # over an hour of runner time, and what it guards against is upstream drift
  # (PackageCompiler, Julia, the simulator) rather than our own changes, which the
  # stubbed tests cover. One simulator is enough, since what could break here is
  # the build machinery, not any particular env. Use `workflow_dispatch` on a
  # branch when that machinery is what changed.
  sysimage:
    name: sysimage (jutuldarcy)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # A cold-cache build runs well over an hour before it has done anything wrong.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Install headless OpenGL (xvfb + Mesa)
        run: sudo apt-get update && sudo apt-get install -y xvfb xorg-dev mesa-utils libgl1 libgl1-mesa-dri

      # A workspace bootstrapped exactly as a user would, since the image is a
      # snapshot of a prepared environment and inherits anything wrong with it.
      # Under xvfb, like the lane above: the env's GLMakie wants a display to
      # precompile, bake and verify.
      - name: Bootstrap a workspace
        run: xvfb-run -a uv run jutul-agent init --sim jutuldarcy --workspace "$RUNNER_TEMP/ws"

      # PackageCompiler links a multi-GB image in one process, and 16 GB is not
      # reliably enough: out of memory, the runner dies rather than the step, and
      # the job ends as "The operation was canceled" with nothing to go on.
      - name: Add swap
        run: |
          sudo fallocate -l 16G /swapfile-ci
          sudo chmod 600 /swapfile-ci
          sudo mkswap /swapfile-ci
          sudo swapon /swapfile-ci
          free -h

      # `time -v` reports peak RSS across the process tree, so the log says how
      # close the build came; the free disk is worth having for the same reason.
      - name: Build the system image
        run: |
          df -h /
          /usr/bin/time -v xvfb-run -a uv run jutul-agent sysimage build --workspace "$RUNNER_TEMP/ws"
          uv run jutul-agent sysimage status --workspace "$RUNNER_TEMP/ws"

      # The kernel is the only place an out-of-memory kill is recorded.
      - name: What the machine says, if the build died
        if: failure()
        run: |
          free -h
          df -h /
          sudo dmesg | tail -50

      - name: Start a kernel from it, and check the staleness guard
        env:
          JUTUL_AGENT_SYSIMAGE_WORKSPACE: ${{ runner.temp }}/ws
        run: xvfb-run -a uv run pytest tests/test_sysimage_integration.py -ra
