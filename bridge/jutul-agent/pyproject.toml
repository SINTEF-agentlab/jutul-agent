# The last release of jutul-agent. The project is now Makker (the rest of this
# repository); this package only carries existing installs across. It is built
# and published by .github/workflows/release-bridge.yml, never by release.yml.
[project]
name = "jutul-agent"
version = "0.3.0rc1"
description = "jutul-agent is now Makker. This final release installs Makker and starts it."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Jakob Torben", email = "jakob.torben@sintef.no"},
]
license = "MIT"
classifiers = [
    "Development Status :: 7 - Inactive",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
# Keep this the only dependency, and keep it first: the release workflow reads
# the Makker version it names.
dependencies = [
    "makker>=0.3.0rc1",
]

[project.urls]
Homepage = "https://github.com/SINTEF-agentlab/makker"
Documentation = "https://sintef-agentlab.github.io/makker/"

[project.scripts]
jutul-agent = "jutul_agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jutul_agent"]
