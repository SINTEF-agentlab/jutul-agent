name = "MakkerMocca"
uuid = "2c594c4c-ba15-48a6-abd4-ceee9b009a5c"
version = "0.1.0"

# Per-simulator warm-up package for Makker (Mocca). Sibling of the shared
# Makker package in this env. Loads the simulator, recompiles GLMakie's solver
# invalidations via @recompile_invalidations, and bakes the agent's simulate_process
# + plot_outlet paths via @compile_workload. Single source of truth for the Mocca
# warm-up.

[deps]
CairoMakie = "13f3f980-e62b-5c42-98c6-ff1f3baf88f0"
GLMakie = "e9467ef8-e4e7-5192-8a1a-b1aee30e663a"
Jutul = "2b460a1a-8a2b-45b2-b125-b5c536396eb9"
Makker = "0d1d1ec9-c0b9-4de0-a260-d13dbbd400b2"
Mocca = "eb14e3ba-90c8-11ed-0ecf-1dd2ea0d109c"
PrecompileTools = "aea7be01-6a6a-4083-8856-8a6e6704d82a"
WGLMakie = "276b4fcb-3e11-5398-bf8b-a0c2d153d008"

[compat]
PrecompileTools = "1"
julia = "1.10"
