[deps]
BattMo = "6f0c0536-3c2c-4762-a987-c605a8a6f898"
CairoMakie = "13f3f980-e62b-5c42-98c6-ff1f3baf88f0"
CSV = "336ed68f-0bac-5ca0-87d4-7b16caf5d00b"
DataFrames = "a93c6f00-e57d-5684-b7b6-d8193f3e46c0"
GLMakie = "e9467ef8-e4e7-5192-8a1a-b1aee30e663a"
GraphMakie = "1ecd5474-83a3-4783-bb4f-06765db800d2"
Interpolations = "a98d9a8b-a2ab-59e6-89dd-64a1c18fca59"
LayeredLayouts = "f4a74d36-062a-4d48-97cd-1356bad1de4e"
NetworkLayout = "46757867-2c16-5918-afeb-47bfcb05e46a"
Jutul = "2b460a1a-8a2b-45b2-b125-b5c536396eb9"
Makker = "0d1d1ec9-c0b9-4de0-a260-d13dbbd400b2"
MakkerBattMo = "93c9a128-c61c-47ba-a3ed-ee8197bf8a0b"

# The web interface's interactive plotting backend. Keep it here rather than in a
# separate env stacked over this one: Julia resolves each env independently, so
# only a resolve that also sees the simulator's constraints can pick Makie and HTTP
# versions that satisfy both. See docs/architecture.md.
Bonito = "824d6782-a2ef-11e9-3a09-e5662e0c26f8"
WGLMakie = "276b4fcb-3e11-5398-bf8b-a0c2d153d008"

# Minimum simulator release supported by the bundled skills.
[compat]
BattMo = "0.2.9"

# Both deps are makker's in-env Julia runtime, declared as relative `[sources]`
# paths so they survive the copy into a workspace. Makker is the shared,
# sim-agnostic core (figure capture, ensemble helpers, generic-Makie warm-up) — it
# has a single source in the repo (src/makker/julia_runtime/Makker) that
# env_setup copies in at bootstrap. MakkerBattMo is this env's per-simulator
# warm-up package (the solve bake + @recompile_invalidations).
[sources]
Makker = {path = "Makker"}
MakkerBattMo = {path = "MakkerBattMo"}
