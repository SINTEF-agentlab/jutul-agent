name = "MakkerBattMo"
uuid = "93c9a128-c61c-47ba-a3ed-ee8197bf8a0b"
version = "0.1.0"

# Per-simulator warm-up package for Makker (BattMo). Sibling of the shared
# Makker package in this env. Loads the simulator, recompiles GLMakie's solver
# invalidations via @recompile_invalidations, and bakes the agent's solve path via
# @compile_workload. Single source of truth for the BattMo warm-up.

[deps]
BattMo = "6f0c0536-3c2c-4762-a987-c605a8a6f898"
CairoMakie = "13f3f980-e62b-5c42-98c6-ff1f3baf88f0"
GLMakie = "e9467ef8-e4e7-5192-8a1a-b1aee30e663a"
Jutul = "2b460a1a-8a2b-45b2-b125-b5c536396eb9"
Makker = "0d1d1ec9-c0b9-4de0-a260-d13dbbd400b2"
PrecompileTools = "aea7be01-6a6a-4083-8856-8a6e6704d82a"
WGLMakie = "276b4fcb-3e11-5398-bf8b-a0c2d153d008"

[compat]
PrecompileTools = "1"
julia = "1.10"
